          - generic [ref=f11e18]:
            - generic [ref=f11e19]:
              - generic [ref=f11e20]: "Comunicado:"
              - generic [ref=f11e21]:
                - text: •
                - paragraph [ref=f11e22]:
                  - strong [ref=f11e23]: COMUNICADO – DISPONIBILIZAÇÃO DO AMBIENTE DE PRODUÇÃO DA NFS-e NO PADRÃO NACIONAL
                - paragraph [ref=f11e24]:
                  - generic [ref=f11e25]:
                    - text: A Secretaria de Estado de Economia (SEEC) informa que o ambiente de produção da NFS-e no
                    - strong [ref=f11e26]: Padrão Nacional
                    - text: já está disponível para utilização pelos sistemas próprios de emissão (Webservice), permitindo que contribuintes e empresas desenvolvedoras iniciem a migração gradativamente.
                - paragraph [ref=f11e27]:
                  - generic [ref=f11e28]:
                    - text: Conforme o
                    - strong [ref=f11e29]: ATO CONJUNTO RFB/CGIBS Nº 4, DE 30 DE JULHO DE 2026
                    - text: ", a emissão da NFS-e no Padrão Nacional será"
                    - strong [ref=f11e30]: obrigatória a partir de 01/10/2026
                    - text: ", quando o padrão ABRASF 2.04 deixará de ser aceito no Distrito Federal."
                - paragraph [ref=f11e31]:
                  - strong [ref=f11e32]: "COMUNICAMOS QUE:"
                - paragraph [ref=f11e33]:
                  - generic [ref=f11e34]:
                    - strong [ref=f11e35]: 1)
                    - text: "O Webservice de produção já está disponível em:"
                    - link "https://nfse.fazenda.df.gov.br/wsnfsenacional/nfse.asmx" [ref=f11e36] [cursor=pointer]:
                      - /url: https://nfse.fazenda.df.gov.br/wsnfsenacional/nfse.asmx
                - paragraph [ref=f11e37]:
                  - generic [ref=f11e38]:
                    - strong [ref=f11e39]: 2)
                    - text: Até
                    - strong [ref=f11e40]: 30/09/2026
                    - text: ", os padrões"
                    - strong [ref=f11e41]: Nacional
                    - text: e
                    - strong [ref=f11e42]: ABRASF 2.04
                    - text: funcionarão em paralelo, permitindo uma migração planejada.
                - paragraph [ref=f11e43]:
                  - generic [ref=f11e44]:
                    - strong [ref=f11e45]: 3)
                    - text: A partir de
                    - strong [ref=f11e46]: 01/10/2026
                    - text: ", serão aceitos"
                    - strong [ref=f11e47]: exclusivamente
                    - text: documentos transmitidos no
                    - strong [ref=f11e48]: Padrão Nacional
                    - text: .
                - paragraph [ref=f11e49]:
                  - generic [ref=f11e50]:
                    - strong [ref=f11e51]: 4)
                    - text: "O ambiente de homologação permanece disponível para testes:"
                    - link "https://nfse.issnetonline.com.br/wsnfsenacional/homologacao/nfse.asmx" [ref=f11e52] [cursor=pointer]:
                      - /url: https://nfse.issnetonline.com.br/wsnfsenacional/homologacao/nfse.asmx
                - paragraph [ref=f11e53]: Recomenda-se que a migração seja realizada o quanto antes, evitando adequações de última hora e permitindo a validação da integração em ambiente de produção.
                - paragraph [ref=f11e54]:
                  - generic [ref=f11e55]:
                    - strong [ref=f11e56]: 5)
                    - text: "Manual de Integração, XMLs de exemplo e arquivos XSD:"
                    - link "https://www.notacontrol.com.br/download/nfse/Manual_integracao_v101.pdf" [ref=f11e57] [cursor=pointer]:
                      - /url: https://www.notacontrol.com.br/download/nfse/Manual_integracao_v101.pdf
                - paragraph [ref=f11e58]:
                  - generic [ref=f11e59]:
                    - text: "Dúvidas técnicas:"
                    - link [ref=f11e60] [cursor=pointer]:
                      - /url: mailto:suporte@notacontrol.com.br
                      - strong [ref=f11e61]: suporte@notacontrol.com.br
                    - text: .
