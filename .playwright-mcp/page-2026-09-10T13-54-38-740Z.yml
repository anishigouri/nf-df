          - generic [ref=f16e18]:
            - generic [ref=f16e19]:
              - generic [ref=f16e20]: "Comunicado:"
              - generic [ref=f16e21]:
                - text: •
                - paragraph [ref=f16e22]:
                  - strong [ref=f16e23]: COMUNICADO – DISPONIBILIZAÇÃO DO AMBIENTE DE PRODUÇÃO DA NFS-e NO PADRÃO NACIONAL
                - paragraph [ref=f16e24]:
                  - generic [ref=f16e25]:
                    - text: A Secretaria de Estado de Economia (SEEC) informa que o ambiente de produção da NFS-e no
                    - strong [ref=f16e26]: Padrão Nacional
                    - text: já está disponível para utilização pelos sistemas próprios de emissão (Webservice), permitindo que contribuintes e empresas desenvolvedoras iniciem a migração gradativamente.
                - paragraph [ref=f16e27]:
                  - generic [ref=f16e28]:
                    - text: Conforme o
                    - strong [ref=f16e29]: ATO CONJUNTO RFB/CGIBS Nº 4, DE 30 DE JULHO DE 2026
                    - text: ", a emissão da NFS-e no Padrão Nacional será"
                    - strong [ref=f16e30]: obrigatória a partir de 01/10/2026
                    - text: ", quando o padrão ABRASF 2.04 deixará de ser aceito no Distrito Federal."
                - paragraph [ref=f16e31]:
                  - strong [ref=f16e32]: "COMUNICAMOS QUE:"
                - paragraph [ref=f16e33]:
                  - generic [ref=f16e34]:
                    - strong [ref=f16e35]: 1)
                    - text: "O Webservice de produção já está disponível em:"
                    - link "https://nfse.fazenda.df.gov.br/wsnfsenacional/nfse.asmx" [ref=f16e36] [cursor=pointer]:
                      - /url: https://nfse.fazenda.df.gov.br/wsnfsenacional/nfse.asmx
                - paragraph [ref=f16e37]:
                  - generic [ref=f16e38]:
                    - strong [ref=f16e39]: 2)
                    - text: Até
                    - strong [ref=f16e40]: 30/09/2026
                    - text: ", os padrões"
                    - strong [ref=f16e41]: Nacional
                    - text: e
                    - strong [ref=f16e42]: ABRASF 2.04
                    - text: funcionarão em paralelo, permitindo uma migração planejada.
                - paragraph [ref=f16e43]:
                  - generic [ref=f16e44]:
                    - strong [ref=f16e45]: 3)
                    - text: A partir de
                    - strong [ref=f16e46]: 01/10/2026
                    - text: ", serão aceitos"
                    - strong [ref=f16e47]: exclusivamente
                    - text: documentos transmitidos no
                    - strong [ref=f16e48]: Padrão Nacional
                    - text: .
                - paragraph [ref=f16e49]:
                  - generic [ref=f16e50]:
                    - strong [ref=f16e51]: 4)
                    - text: "O ambiente de homologação permanece disponível para testes:"
                    - link "https://nfse.issnetonline.com.br/wsnfsenacional/homologacao/nfse.asmx" [ref=f16e52] [cursor=pointer]:
                      - /url: https://nfse.issnetonline.com.br/wsnfsenacional/homologacao/nfse.asmx
                - paragraph [ref=f16e53]: Recomenda-se que a migração seja realizada o quanto antes, evitando adequações de última hora e permitindo a validação da integração em ambiente de produção.
                - paragraph [ref=f16e54]:
                  - generic [ref=f16e55]:
                    - strong [ref=f16e56]: 5)
                    - text: "Manual de Integração, XMLs de exemplo e arquivos XSD:"
                    - link "https://www.notacontrol.com.br/download/nfse/Manual_integracao_v101.pdf" [ref=f16e57] [cursor=pointer]:
                      - /url: https://www.notacontrol.com.br/download/nfse/Manual_integracao_v101.pdf
                - paragraph [ref=f16e58]:
                  - generic [ref=f16e59]:
                    - text: "Dúvidas técnicas:"
                    - link [ref=f16e60] [cursor=pointer]:
                      - /url: mailto:suporte@notacontrol.com.br
                      - strong [ref=f16e61]: suporte@notacontrol.com.br
                    - text: .
